name: Verify Supabase GADM

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-supabase-gadm
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Corrigir imports Compose incompatíveis
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/rodriguesacai/gadm/ui/UpGestorApp.kt')
          s=p.read_text()
          s=s.replace('import androidx.compose.foundation.layout.weight\n','')
          s=s.replace('import androidx.compose.runtime.rememberSaveable\n','import androidx.compose.runtime.saveable.rememberSaveable\n')
          p.write_text(s)
          PY
      - name: Compilar
        run: gradle :app:compileDebugKotlin --stacktrace
      - name: Salvar correção se compilou
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/rodriguesacai/gadm/ui/UpGestorApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: correct Compose imports for current compiler'
          git push origin HEAD:verify-supabase-gadm
