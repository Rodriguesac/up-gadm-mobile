name: Migrate GADM Catalog to Supabase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-catalog-supabase.yml'

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch GADM repository
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('app/src/main/java/com/rodriguesacai/gadm/data/GadmRepository.kt')
          s=p.read_text()

          marker='import kotlinx.coroutines.flow.callbackFlow\n'
          if 'import kotlinx.coroutines.delay' not in s:
              assert marker in s
              s=s.replace(marker, marker+'import kotlinx.coroutines.delay\nimport kotlinx.coroutines.isActive\nimport kotlinx.coroutines.launch\n',1)

          old='''class GadmRepository(\n    private val db: FirebaseFirestore = FirebaseFirestore.getInstance()\n) {'''
          new='''class GadmRepository(\n    private val db: FirebaseFirestore = FirebaseFirestore.getInstance()\n) {\n    private val catalogClient = SupabaseCatalogClient()'''
          if 'private val catalogClient = SupabaseCatalogClient()' not in s:
              assert old in s
              s=s.replace(old,new,1)

          old='''    fun observeProducts(): Flow<List<GadmProduct>> = observeCollection("produtos") { it.toGadmProduct() }'''
          new='''    fun observeProducts(): Flow<List<GadmProduct>> = callbackFlow {\n        val job = launch {\n            while (isActive) {\n                val products = runCatching { catalogClient.listProducts() }.getOrElse { emptyList() }\n                trySend(products)\n                delay(10_000)\n            }\n        }\n        awaitClose { job.cancel() }\n    }'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'catalogClient.listProducts()' not in s:
              raise SystemExit('observeProducts não localizado')

          pattern=r'''    suspend fun signIn\(pin: String\): Result<GadmUser> = runCatching \{[\s\S]*?\n    \}\n\n    suspend fun changePin\(userId: String, newPin: String\): Result<Unit> = runCatching \{[\s\S]*?\n    \}\n'''
          replacement='''    suspend fun signIn(pin: String): Result<GadmUser> = runCatching {\n        require(pin.length == 5 && pin.all(Char::isDigit)) { "Digite os 5 números do PIN." }\n        catalogClient.signIn(pin)\n    }\n\n    suspend fun changePin(userId: String, newPin: String): Result<Unit> = runCatching {\n        require(newPin.length == 5 && newPin.all(Char::isDigit)) { "O novo PIN precisa ter 5 números." }\n        catalogClient.changePin(newPin)\n    }\n'''
          if 'catalogClient.signIn(pin)' not in s:
              s,n=re.subn(pattern,replacement,s,count=1)
              assert n==1, f'bloco signIn/changePin: {n}'

          pattern=r'''    suspend fun toggleProduct\(product: GadmProduct, paused: Boolean\): Result<Unit> = runCatching \{[\s\S]*?\n    \}\n\n    suspend fun sendGlobalCommunication'''
          replacement='''    suspend fun toggleProduct(product: GadmProduct, paused: Boolean): Result<Unit> = runCatching {\n        catalogClient.toggleProduct(product.id, paused)\n        audit("PRODUTO_${if (paused) "PAUSADO" else "ATIVADO"}", product.id, product.name, product.category)\n    }\n\n    suspend fun sendGlobalCommunication'''
          if 'catalogClient.toggleProduct(product.id, paused)' not in s:
              s,n=re.subn(pattern,replacement,s,count=1)
              assert n==1, f'bloco toggleProduct: {n}'

          p.write_text(s)
          PY

      - name: Compile Android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit only after successful compile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/rodriguesacai/gadm/data/GadmRepository.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat: use Supabase for GADM catalog and PIN auth'
          git push origin HEAD:main
